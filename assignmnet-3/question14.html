<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Movie Database</title>
</head>
<body>
  <header>
    <h1>My Movie Database</h1>
  </header>

  <main>
    <table border="1" cellpadding="6" cellspacing="0" title="Movie table">
      <caption>Top Movies</caption>
      <thead>
        <tr>
          <th>Movie Name</th>
          <th>Genre</th>
          <th>Year</th>
          <th>IMDB Rating</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>The Example</td>
          <td>Drama</td>
          <td>2023</td>
          <td>8.1</td>
          <td><a href="#" title="More info">Details</a></td>
        </tr>
        <tr>
          <td colspan="2">Classic Collection</td>
          <td>Various</td>
          <td>—</td>
          <td><a href="#">Collection</a></td>
        </tr>
      </tbody>
    </table>

    <p><small>Note: Ratings are illustrative only.</small></p>
  </main>

  <footer>
    <p>© 2025 Movie Database</p>
  </footer>
</body>
</html>
