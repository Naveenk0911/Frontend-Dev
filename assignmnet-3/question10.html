<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dropdown Selection Page</title>
</head>
<body>
  <header>
    <h1>Location & Favorite Place Selection</h1>
  </header>

  <main>
    <form>
      <p>
        <label for="country">Country:</label><br>
        <select id="country" name="country">
          <option value="india" selected>India</option>
          <option value="usa">United States</option>
          <option value="uk">United Kingdom</option>
        </select>
      </p>

      <p>
        <label for="state">State:</label><br>
        <select id="state" name="state">
          <option value="up" selected>Uttar Pradesh</option>
          <option value="maharashtra">Maharashtra</option>
        </select>
      </p>

      <p>
        <label for="city">City:</label><br>
        <select id="city" name="city">
          <option value="mathura" selected>Mathura</option>
          <option value="agra">Agra</option>
        </select>
      </p>

      <p>
        <label for="place">Favorite Tourist Place:</label><br>
        <select id="place" name="place">
          <option value="vrindavan" selected>Vrindavan</option>
          <option value="taj" >Taj Mahal</option>
        </select>
      </p>
    </form>

    <p>My selection: Country - India; State - Uttar Pradesh; City - Mathura; Favorite Place - Vrindavan.</p>
  </main>

  <footer>
    <p>© 2025 Selection Demo</p>
  </footer>
</body>
</html>
